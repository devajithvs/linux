%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/oneplus,aa553-p-7-a0001.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OnePlus AA553-P-7-A0001 AMOLED DSI panel

maintainers:
  - Devajith Valaparambil Sreeramaswamy <devajithvs@gmail.com>

description: |
  The AA553-P-7-A0001 is the 1240x2772 command-mode AMOLED panel of the
  OnePlus Nord 4 (Avalon). AA553-P-7-A0001 is OPLUS's module designation; the
  downstream device tree does not name the panel vendor.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: oneplus,aa553-p-7-a0001

  reg:
    maxItems: 1
    description: DSI virtual channel

  vddio-supply: true
  vci-supply: true
  reset-gpios: true
  port: true

required:
  - compatible
  - reg
  - vddio-supply
  - vci-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "oneplus,aa553-p-7-a0001";
            reg = <0>;

            vddio-supply = <&vreg_l8b_1p8>;
            vci-supply = <&vreg_l19b_3p0>;
            reset-gpios = <&tlmm 79 GPIO_ACTIVE_LOW>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi0_out>;
                };
            };
        };
    };
...
