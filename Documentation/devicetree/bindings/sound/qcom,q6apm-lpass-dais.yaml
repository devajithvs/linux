%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,q6apm-lpass-dais.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm DSP LPASS (Low Power Audio SubSystem) Audio Ports

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    enum:
      - qcom,q6apm-lpass-dais

  '#sound-dai-cells':
    const: 1

  clocks:
    description:
      LPASS interface clock of the secondary MI2S, driven by the LPASS PRM
      (q6prm). The DAI votes its frequency at hw_params; without the vote the
      DSP's I2S endpoint has no bit clock and never returns a buffer.
    maxItems: 1

  clock-names:
    items:
      - const: sec-mi2s-ibit

required:
  - compatible
  - '#sound-dai-cells'

unevaluatedProperties: false

examples:
  - |
    dais {
        compatible = "qcom,q6apm-lpass-dais";
        #sound-dai-cells = <1>;
    };
