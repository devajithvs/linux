%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/nxp,tfa987x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP TFA9873/TFA9874 speaker amplifiers

maintainers:
  - Devajith Valaparambil Sreeramaswamy <devajithvs@gmail.com>

description: |
  The TFA9873 and TFA9874 are Class-D speaker amplifiers with I2S/TDM input
  and an I2C control interface. They are smart amplifiers: the speaker
  protection runs on an internal DSP that has to be loaded with NXP's
  configuration container before playback. The device tree only describes the
  bus address, the reset line and the supply; the container is a firmware
  file, and the driver reports at probe which of the two parts answered.

properties:
  compatible:
    enum:
      - nxp,tfa9873
      - nxp,tfa9874

  reg:
    maxItems: 1

  reset-gpios:
    description: |
      Active-high reset line. The line is asserted high and released low.
    maxItems: 1

  vddd-supply:
    description: 1.8 V I/O and amplifier supply.

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - reset-gpios
  - vddd-supply
  - '#sound-dai-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        speaker@34 {
            compatible = "nxp,tfa9873";
            reg = <0x34>;
            reset-gpios = <&tlmm 127 GPIO_ACTIVE_HIGH>;
            vddd-supply = <&vreg_l7b_1p8>;
            #sound-dai-cells = <0>;
        };
    };
...
