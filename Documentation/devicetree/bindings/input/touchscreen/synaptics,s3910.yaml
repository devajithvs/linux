%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/synaptics,s3910.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synaptics S3910 TouchComm touchscreen controller

description: |
  The Synaptics S3910 is a TouchComm (TCM) generation 1 touchscreen
  controller. It runs its firmware from internal flash and boots directly
  into application mode, so no firmware download is needed from the host.
  This binding describes the SPI connection.

maintainers:
  - Devajith Valaparambil Sreeramaswamy <devajithvs@gmail.com>

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: syna,s3910

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Interrupt line asserted when a TouchComm message is ready.

  reset-gpios:
    maxItems: 1
    description: Active-low reset line of the controller.

  vdd-supply:
    description: Analog supply, 2.7 V to 3.4 V.

  vio-supply:
    description: I/O supply, typically 1.8 V, that powers the SPI pads.

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - vdd-supply
  - vio-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "syna,s3910";
            reg = <0>;
            spi-max-frequency = <19000000>;
            interrupt-parent = <&tlmm>;
            interrupts = <129 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&tlmm 128 GPIO_ACTIVE_LOW>;
            vdd-supply = <&vreg_l22b>;
            vio-supply = <&vreg_touch_vio>;
        };
    };
